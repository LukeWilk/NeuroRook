name: Kover Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  kover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup local.properties for CI
        run: |
          echo "GHUSER=${{ secrets.GHUSER }}" >> local.properties
          echo "GHTOKEN=${{ secrets.GHTOKEN }}" >> local.properties
      - name: Build and run tests with coverage
        run: ./gradlew koverXmlReport koverHtmlReport
        env:
          GHTOKEN: ${{ secrets.GHTOKEN }}
          GHUSER: ${{ secrets.GHUSER }}
      - name: Upload Kover HTML report
        uses: actions/upload-artifact@v4
        with:
          name: kover-html-report
          path: build/reports/kover/html/
      - name: Upload Kover XML report
        uses: actions/upload-artifact@v4
        with:
          name: kover-xml-report
          path: build/reports/kover/report.xml
